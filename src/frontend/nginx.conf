server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（带内容哈希的文件可长缓存）
    # 注意：不使用 immutable —— immutable 会让浏览器在 max-age 内连条件请求都不发，
    # 一旦出现 chunk hash 未变但内容变化的情况，旧代码会被长期复用导致部署不生效。
    # 不使用 expires 指令，避免它与下面的 add_header 同时输出两个 Cache-Control 头
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # API 反代到后端服务（Docker 网络中 backend 服务名 + 端口 8080）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # SPA history 模式 fallback：未匹配静态资源时回退到 index.html
    location / {
        # SPA 入口彻底禁止缓存：避免部署后浏览器 memory cache / 企业网关复用旧 index.html，
        # 导致页面仍引用已被删除的旧 JS chunk（表现为接口未发出、看板加载失败）。
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
