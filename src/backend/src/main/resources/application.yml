server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: issueFlow
  profiles:
    active: dev
  # 启动时执行建表/初始化 SQL
  # 【安全 · M3】基线/开发保留 always（便于本地一键起库）；
  # 生产档 application-prod.yml 覆盖为 never，防止重启误重建 schema / 覆盖 data。
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
      continue-on-error: true
  # 文件上传限制(附件模块使用，地基预留)
  # 容器层放宽到 50MB，业务上限由 sys_config 的 file.max_size_mb 动态收紧
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  # 定时任务调度线程池（Phase7 DynamicTaskScheduler 使用）
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: if-sched-
  # Redis(开发环境默认本机，生产由 application-prod.yml 覆盖)
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      # Redis 监控页只读 INFO，超时收紧到 2s 避免监控请求长时间挂起
      timeout: 2000ms

# MyBatis-Plus 全局配置（独立前缀，非 spring.*）
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.issueflow.entity
  configuration:
    map-underscore-to-camel-case: true
    # 【安全 · M2】基线/开发保留 StdOutImpl，方便本地调试看完整 SQL；
    # 生产档 application-prod.yml 覆盖为 NoLoggingImpl，避免 SQL 与参数明文落盘。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: ""

# JWT 配置
# ============================================================================
# 【安全 · M1】密钥仅在此基线/开发档保留默认值，生产环境强制外部注入！
#   - 本档默认值 **仅限本地开发**，禁止用于任何联网/生产环境；
#   - 生产档 application-prod.yml 已改为 ${JWT_SECRET}（无兜底），
#     未注入 JWT_SECRET 环境变量时应用会快速失败并打印指引；
#   - 密钥要求 HS256 ≥ 32 字节，生成命令：openssl rand -base64 48
#   - 校验逻辑见 com.issueflow.security.JwtUtil#init
# ============================================================================
jwt:
  secret: ${JWT_SECRET:issueflow-LOCAL-DEV-ONLY-secret-key-do-not-use-in-prod!!}
  expiration: ${JWT_EXPIRATION:7200}   # 秒，2 小时

# 应用自定义配置
app:
  attachment-base-path: ${ATTACHMENT_BASE_PATH:/data/attachments}
  # 文件模块兜底默认值（sys_config 的 file.* 缺键时生效）
  file:
    storage-root: ${FILE_STORAGE_ROOT:/data/attachments}
    max-size-mb: ${FILE_MAX_SIZE_MB:10}
    allowed-exts: ${FILE_ALLOWED_EXTS:jpg,jpeg,png,gif,pdf,zip,rar,doc,docx,xls,xlsx,txt,log}
    storage-type: ${FILE_STORAGE_TYPE:LOCAL}

# 系统数据初始化开关（R7，默认开启；需要关闭时取消注释并置 false）
# system:
#   data-reset:
#     enabled: false

# ============================================================================
# Phase10 数据管理（备份 / 恢复）
#
# 【与 sys_config 的分工】
#   本段是**运维级、需重启生效**的项（可执行文件路径、目录、超时）；
#   保留份数 / 保留天数 / 上传上限 / 任务超时 / 恢复前自动备份
#   由管理员在「数据管理」页改，落在 sys_config 的 data.management.* 键上，热生效。
#
# 【安全红线】本段**不含任何数据库密码**。
#   mysqldump / mysql 的凭据一律由 BackupExecutor 生成 0600 权限的
#   --defaults-extra-file 临时文件传递，绝不出现在命令行参数中（防 ps 窥探）。
# ============================================================================
issueflow:
  data-management:
    enabled: ${DATA_MANAGEMENT_ENABLED:true}
    backup-dir: ${BACKUP_DIR:/data/issueflow/backups}
    # 镜像内由 Dockerfile 从 mysql:8.0 复制（禁用 mariadb-client，dump 方言不兼容）
    mysqldump-path: ${MYSQLDUMP_PATH:/usr/bin/mysqldump}
    mysql-client-path: ${MYSQL_CLIENT_PATH:/usr/bin/mysql}
    # 需一并打包的配置文件（脱敏后写入 config/），不存在的条目静默跳过
    config-files: ${BACKUP_CONFIG_FILES:/app/config/application.yml,/app/config/.env}
    task-timeout-seconds: ${DATA_TASK_TIMEOUT:1800}
    lock-ttl-seconds: ${DATA_LOCK_TTL:3600}
    progress-ttl-seconds: ${DATA_PROGRESS_TTL:7200}
    file-name-prefix: issueflow_backup
    exclude-tables: ${BACKUP_EXCLUDE_TABLES:}
    max-allowed-packet-mb: ${BACKUP_MAX_PACKET_MB:128}

# 日志
logging:
  level:
    com.issueflow: debug
    root: info
