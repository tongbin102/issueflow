spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境全部使用环境变量注入，避免敏感信息落地
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB:issueflow}?useUnicode=true&characterEncoding=UTF-8&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}

app:
  attachment-base-path: ${ATTACHMENT_BASE_PATH:/data/attachments}

jwt:
  secret: ${JWT_SECRET:issueflow-secret-key-2024-issueflow-jwt-secure-32bytes!!}
  expiration: ${JWT_EXPIRATION:7200}

logging:
  level:
    com.issueflow: info
    root: warn
