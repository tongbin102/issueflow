spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境全部使用环境变量注入，避免敏感信息落地
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB:issueflow}?useUnicode=true&characterEncoding=UTF-8&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
  # ==========================================================================
  # 【安全 · M3】生产禁止启动时自动执行 schema.sql / data.sql
  #   背景：2026-08-01 发生过整库丢失事故，always 模式下每次重启都会重跑初始化
  #        脚本，存在误重建 / 覆盖生产数据的风险。
  #   影响面确认：
  #     - 默认管理员 admin 账号与密码由 IssueFlowApplication#initAdminUser
  #       （ApplicationRunner）在启动时写入，**不依赖 data.sql**，改 never 不影响；
  #     - 但 ADMIN **角色行**来自 data.sql。生产库该行已存在，故无影响；
  #       若将来对**全新空库**部署，需先手工导入 schema.sql + data.sql，
  #       否则 initAdminUser 会抛 "ADMIN 角色未初始化"。
  #   回滚：将本项改回 always 并重启（仅限确认无覆盖数据风险时）。
  # ==========================================================================
  sql:
    init:
      mode: never

# ==========================================================================
# 【安全 · M2】生产关闭 MyBatis SQL 全量日志
#   StdOutImpl 会把 "==> Preparing:" / "==> Parameters:" 全量明文打到 stdout，
#   容器日志中会出现密码哈希、手机号、邮箱等敏感参数。
#   生产改为 NoLoggingImpl：彻底不打印，且不受 logging.level 影响。
#   开发档（application.yml）仍为 StdOutImpl，本地调试能力不受影响。
# ==========================================================================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  attachment-base-path: ${ATTACHMENT_BASE_PATH:/data/attachments}

# ==========================================================================
# 【安全 · M1】JWT 密钥：生产**不允许兜底**，必须由环境变量注入
#   - 未注入 JWT_SECRET 时，Spring 占位符解析失败 → 应用启动即失败（预期行为）；
#   - 注入了但为空 / 长度 < 32 字节时，JwtUtil#init 抛出带明确指引的异常；
#   - 生成强随机密钥：openssl rand -base64 48
#   - 部署前置：23 号服务器 .env 必须写入 JWT_SECRET=<≥32字节强随机>
#   注意：docker-compose.yml 中 backend 的 JWT_SECRET 目前仍带 ":-<默认值>" 兜底，
#        该文件属主受限未在本次改动。M1 完全闭环还需移除 compose 侧兜底，
#        详见 README「部署前置」与本次变更报告。
# ==========================================================================
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200}

logging:
  level:
    com.issueflow: info
    # 【安全 · M2 补强】显式收敛 mapper 包日志级别，双保险确保 SQL 明文不落盘
    com.issueflow.mapper: info
    root: warn
