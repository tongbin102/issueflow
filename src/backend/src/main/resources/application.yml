server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: issueFlow
  profiles:
    active: dev
  # 启动时执行建表/初始化 SQL
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
      continue-on-error: true
  # 文件上传限制(附件模块使用，地基预留)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  # Redis(开发环境默认本机，生产由 application-prod.yml 覆盖)
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000ms

# MyBatis-Plus 全局配置（独立前缀，非 spring.*）
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.issueflow.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: ""

# JWT 配置
jwt:
  secret: "issueflow-secret-key-2024-issueflow-jwt-secure-32bytes!!"
  expiration: 7200   # 秒，2 小时

# 应用自定义配置
app:
  attachment-base-path: ${ATTACHMENT_BASE_PATH:/data/attachments}

# 系统数据初始化开关（R7，默认开启；需要关闭时取消注释并置 false）
# system:
#   data-reset:
#     enabled: false

# 日志
logging:
  level:
    com.issueflow: debug
    root: info
